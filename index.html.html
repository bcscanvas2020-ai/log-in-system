<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secure Login</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial;

  background: linear-gradient(135deg, #00c6ff, #0072ff, #1e3c72);
}

.login-box {
  width: 320px;
  padding: 32px;
  border-radius: 18px;

  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px);

  text-align: center;
  color: white;

  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.15);
}

/* LOGO */
.logo {
  width: 75px;
  height: 75px;
  margin: 0 auto 12px auto;

  border-radius: 50%;
  background: rgba(255,255,255,0.12);

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.25);

  box-shadow: 0 0 10px rgba(0, 198, 255, 0.6),
              0 0 25px rgba(0, 114, 255, 0.4);

  animation: glowPulse 2s infinite ease-in-out;
}

@keyframes glowPulse {
  0% {
    box-shadow: 0 0 8px rgba(0, 198, 255, 0.4),
                0 0 20px rgba(0, 114, 255, 0.3);
    transform: scale(1);
  }

  50% {
    box-shadow: 0 0 18px rgba(0, 198, 255, 0.9),
                0 0 35px rgba(0, 114, 255, 0.7);
    transform: scale(1.05);
  }

  100% {
    box-shadow: 0 0 8px rgba(0, 198, 255, 0.4),
                0 0 20px rgba(0, 114, 255, 0.3);
    transform: scale(1);
  }
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.login-box h2 {
  margin-bottom: 18px;
  font-weight: 500;
}

input {
  width: 100%;
  padding: 11px;
  margin: 10px 0;

  border: none;
  border-radius: 10px;
  outline: none;

  background: rgba(255,255,255,0.15);
  color: white;
}

input::placeholder {
  color: rgba(255,255,255,0.7);
}

button {
  width: 100%;
  padding: 11px;
  margin-top: 8px;

  border: none;
  border-radius: 10px;

  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
  font-weight: bold;

  cursor: pointer;
}

#error {
  color: #ff6b6b;
  margin-top: 10px;
  font-size: 13px;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

</head>

<body>

<div class="login-box">

  <!-- 🖼️ LOGO (FIXED) -->
  <div class="logo">
    <img src="./asset4.png" alt="Logo">
  </div>

  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="error"></p>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAtnz7uPNK06Kk9KLHQ7fRhpfRlGxtCVhw",
  authDomain: "log-in-95713.firebaseapp.com",
  projectId: "log-in-95713",
  storageBucket: "log-in-95713.firebasestorage.app",
  messagingSenderId: "953428489483",
  appId: "1:953428489483:web:61d71af0979c6729631e0e"
};

firebase.initializeApp(firebaseConfig);

function login() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then(() => {
      window.location.href = "https://sites.google.com/view/mcqkhalidsgk/home";
    })
    .catch((error) => {
      document.getElementById("error").innerText = error.message;
    });
}

</script>

</body>
</html>
