<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secure Login</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial;

  background: linear-gradient(135deg, #1e90ff, #00c6ff);
}

/* Card */
.login-box {
  width: 320px;
  padding: 30px;
  border-radius: 15px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  text-align: center;
  color: white;
  position: relative;
}

/* LOGO (Replace here 🔥) */
.logo {
  width: 90px;
  height: 90px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo img {
  width: 90px;
}

/* Title */
h2 {
  margin-top: 50px;
}

/* Input */
.input-box {
  margin: 20px 0;
}

.input-box input {
  width: 100%;
  padding: 10px;
  border: none;
  border-bottom: 1px solid white;
  background: transparent;
  color: white;
  outline: none;
}

/* Checkbox */
.options {
  font-size: 13px;
  text-align: left;
}

/* Button */
button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #002b5c;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #001a3a;
}

/* Error */
#error {
  margin-top: 10px;
  color: #ffdede;
}
</style>

</head>

<body>

<div class="login-box">

  <!-- 🔥 এখানে তোমার logo বসাও -->
  <div class="logo">
    <img src="Asset 4.png">
  </div>

  <h2>Login</h2>

  <div class="input-box">
    <input type="email" id="email" placeholder="Email">
  </div>

  <div class="input-box">
    <input type="password" id="password" placeholder="Password">
  </div>

  <div class="options">
    <input type="checkbox"> Remember me
  </div>

  <button onclick="login()">LOGIN</button>

  <p id="error"></p>

</div>

<script>

// 🔥 Firebase config বসাও এখানে
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
};

// Init
firebase.initializeApp(firebaseConfig);

// Login function
function login() {
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then(() => {
      window.location.href = "https://sites.google.com/view/khalids-gk-just-msq";
    })
    .catch(error => {
      document.getElementById("error").innerText = error.message;
    });
}

</script>

</body>
</html>
